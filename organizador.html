
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fut de sexta — Organizador</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f3;color:#17251d;margin:0;padding:20px}
main{max-width:900px;margin:auto}
header{background:#176b43;color:white;padding:24px;border-radius:16px}
section{background:white;padding:18px;margin-top:16px;border-radius:14px}
button{padding:10px 14px;border:0;border-radius:8px;background:#176b43;color:white;cursor:pointer;margin:4px}
input,select{padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px;max-width:100%}
.person{padding:12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
small{color:#64736a}
</style>
</head>
<body>
<main>
<header>
<h1>⚽ Fut de sexta</h1>
<p>Painel do organizador</p>
<a href="index.html" style="color:white">Página inicial</a> ·
<a href="jogador.html" style="color:white">Área do jogador</a>
</header>

<section>
<h2>Resumo</h2>
<p id="resumo">Carregando jogadores...</p>
</section>

<section>
<h2>Cadastrar jogador</h2>
<input id="nome" placeholder="Nome do jogador">
<select id="tipo">
<option value="mensalista">Mensalista — R$ 50/mês</option>
<option value="avulso">Avulso — R$ 15/partida</option>
<option value="goleiro">Goleiro — gratuito</option>
</select>
<button onclick="adicionar()">Cadastrar</button>
</section>

<section>
<h2>Jogadores e presença</h2>
<div id="lista"></div>
</section>

<section>
<h2>Financeiro</h2>
<p id="financeiro"></p>
</section>
</main>

<script>
const chave='chutaFofoPlayers';
const iniciais=[];
let jogadores=[];
try{
jogadores=JSON.parse(localStorage.getItem(chave))||iniciais;
if(!Array.isArray(jogadores))jogadores=[];
}catch(e){jogadores=[]}

function salvar(){
localStorage.setItem(chave,JSON.stringify(jogadores));
mostrar();
}
function adicionar(){
const campo=document.getElementById('nome');
const nome=campo.value.trim();
const tipo=document.getElementById('tipo').value;
if(!nome){alert('Digite o nome do jogador.');return}
if(jogadores.some(p=>p.name.toLowerCase()===nome.toLowerCase())){
alert('Esse jogador já está cadastrado.');return;
}
jogadores.push({
name:nome,type:tipo,
code:Math.random().toString(36).slice(2,8).toUpperCase(),
attendance:false,paid:false,waiting:tipo==='avulso',
casualPaid:false,queueOrder:jogadores.length+1
});
campo.value='';
salvar();
}
function alternar(i,campo){
jogadores[i][campo]=!jogadores[i][campo];
salvar();
}
function excluir(i){
if(confirm('Excluir '+jogadores[i].name+'?')){
jogadores.splice(i,1);
salvar();
}
}
function mostrar(){
const linhas=jogadores.filter(p=>p.type!=='goleiro'&&p.attendance&&!p.waiting).length;
const goleiros=jogadores.filter(p=>p.type==='goleiro'&&p.attendance).length;
const mensalistas=jogadores.filter(p=>p.type==='mensalista');
const pagos=mensalistas.filter(p=>p.paid).length;
const avulsos=jogadores.filter(p=>p.type==='avulso'&&p.attendance);
const recebido=mensalistas.filter(p=>p.paid).length*50+
avulsos.filter(p=>p.casualPaid).length*15;
document.getElementById('resumo').textContent=
jogadores.length+' cadastrados · '+linhas+'/12 jogadores de linha · '+goleiros+'/2 goleiros';
document.getElementById('financeiro').textContent=
'Mensalidades: '+pagos+'/'+mensalistas.length+' pagas. Total recebido registrado: '+
recebido.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
document.getElementById('lista').innerHTML=jogadores.map((p,i)=>{
const tipo=p.type==='mensalista'?'Mensalista':p.type==='goleiro'?'Goleiro':'Avulso';
return '<div class="person"><div><strong>'+esc(p.name)+'</strong><br><small>'+
tipo+' · Código: '+esc(p.code||'—')+' · '+(p.attendance?'Confirmado':'Não confirmou')+
(p.waiting?' · Espera':'')+'</small><br><small>'+
(p.paid?'Mensalidade paga':'Mensalidade pendente')+
(p.type==='avulso'?' · '+(p.casualPaid?'Partida paga':'Partida pendente'):'')+
'</small></div><div><button onclick="alternar('+i+',\'attendance\')">'+
(p.attendance?'Cancelar presença':'Confirmar')+'</button>'+
(p.type==='mensalista'?'<button onclick="alternar('+i+',\'paid\')">'+
(p.paid?'Desmarcar pagamento':'Marcar pago')+'</button>':'')+
(p.type==='avulso'?'<button onclick="alternar('+i+',\'casualPaid\')">'+
(p.casualPaid?'Desmarcar pagamento':'Marcar R$ 15 pago')+'</button>':'')+
'<button onclick="excluir('+i+')">Excluir</button></div></div>';
}).join('')||'<p>Nenhum jogador cadastrado.</p>';
}
function esc(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
mostrar();
</script>
</body>
</html>
